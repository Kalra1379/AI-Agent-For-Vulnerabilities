<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="brand"><span class="dot"></span>AI Site Guardian</div><span class="mode" id="mode"></span></header>
<section class="top"><div class="ring" id="ring"><b id="score">--</b></div>
<div><div class="host" id="host">Reading this page…</div><div class="tags" id="tags"></div><button id="rescan" class="ghost">Scan again</button></div></section>

<section id="list"></section>
<section class="chat"><div id="answer" hidden></div>
<div class="ask"><input id="q" placeholder="Ask the agent: what should I fix first?" maxlength="300"><button id="send">Ask</button></div></section>
<footer><label>Backend <input id="api" spellcheck="false"></label></footer>
<script src="popup.js"></script></body></html>
